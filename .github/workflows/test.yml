name: test_pipeline

on:
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test
        run: nvm -B verify
  
